openapi: 3.0.0
info:
  title: Task Tracker API
  version: 1.0.0
  description: API documentation for Task Tracker
servers:
  - url: http://localhost:3000

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Task:
      type: object
      properties:
        taskId:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
        estimate_time:
          type: number
        logged_time:
          type: number
        priority:
          type: string
        due_date:
          type: string
          format: date
        userId:
          type: string
        timeLogHistory:
          type: array
          items:
            type: object
            properties:
              entryId:
                type: integer
              duration:
                type: number
              date:
                type: string
                format: date-time
              note:
                type: string
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        name:
          type: string
          description: User's name
        email:
          type: string
          format: email
          description: User's email address
        created_at:
          type: string
          format: date-time
          description: User creation date

security:
  - bearerAuth: []

paths:
  /api/auth/signup:
    post:
      summary: Sign up new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
                    description: JWT authentication token
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid input
        '409':
          description: Email already registered
  /api/auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          security: []
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
                    description: JWT authentication token
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing email or password
        '401':
          description: Invalid credentials
  /api/tasks:
    get:
      summary: Get all tasks
      responses:
        '200':
          description: List of tasks
          security: []
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                estimate_time:
                  type: number
                logged_time:
                  type: number
                priority:
                  type: string
                due_date:
                  type: string
                  format: date
                userId:
                  type: string
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
  /api/tasks/{id}:
    get:
      summary: Get a single task by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  task:
                    $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
    put:
      summary: Update task by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
        '404':
          description: Task not found
  /api/tasks/{id}/time-log/{entryId}:
    put:
      summary: Update a specific time log entry for a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: entryId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  type: number
                note:
                  type: string
      responses:
        '200':
          description: Time log updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Invalid duration
        '404':
          description: Task or time log entry not found
  /api/tasks/{taskId}/time-summary:
    get:
      summary: Get time summary for a task
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Time summary retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  taskId:
                    type: integer
                  total_logged:
                    type: number
                  timeLogHistory:
                    type: array
                    items:
                      type: object
                      properties:
                        entryId:
                          type: integer
                        duration:
                          type: number
                        date:
                          type: string
                          format: date-time
                        note:
                          type: string
        '404':
          description: Task not found
  /api/analytics/time:
    get:
      summary: Get time analytics for all tasks
      responses:
        '200':
          description: Time analytics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  analytics:
                    type: object
        '404':
          description: No analytics found
  /api/user/profile:
    get:
      summary: Get user profile
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
        '404':
          description: User not found
    delete:
      summary: Delete user profile
      responses:
        '200':
          description: User profile deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: User not found
  /api/tasks/{id}/time-log:
    post:
      summary: Log time for a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  type: number
                note:
                  type: string
      responses:
        '200':
          description: Time logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  task:
                    $ref: '#/components/schemas/Task'
                  entry:
                    type: object
                    properties:
                      entryId:
                        type: integer
                      duration:
                        type: number
                      date:
                        type: string
                        format: date-time
                      note:
                        type: string
        '400':
          description: Invalid duration
        '404':
          description: Task not found

